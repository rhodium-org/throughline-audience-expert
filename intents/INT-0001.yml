uid: INT-0001
type: intent
status: approved
title: "Text is pitched for an expert reader"
text: "An expert reader has full command of the field. They expect the writing to build on shared fundamentals, use precise terminology without definition, go to full technical depth, and get straight to the substantive point rather than orienting them to basics they already hold. This axis governs how the writing is calibrated to the reader's expertise — assumed knowledge, terminology, depth and orientation — not universal readability, spelling, register or purpose, each of which is a separate source. Audience levels are mutually exclusive: a consumer composes exactly one of the expert, practitioner or general sibling sources."
normative: false
